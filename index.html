<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23408E">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="삿포로">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>겨울, 삿포로</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* 가족 여행용 휴대폰 앱. 흰 바탕, 글씨는 검정·회색, 색은 파랑 하나(이동 · 선택된 것). 아래 탭 5개. */
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#14181F; --muted:#6B7280; --line:#E6E8EC; --soft:#EEF1F6;
  --accent:#23408E; --accent-soft:#E7ECF7; --warn:#B4470F; --ok:#177245;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-jp:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --tabh:64px; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --card:#171B22; --ink:#ECEFF4; --muted:#9AA3B2; --line:#262C36; --soft:#1F242D;
  --accent:#9DB4F5; --accent-soft:#1E2740; --warn:#F0935A; --ok:#6CC79A; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.jp{font-family:var(--f-jp)}

/* ---------- 잠금 화면 */
#lock{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:24px max(24px,env(safe-area-inset-left)) 24px max(24px,env(safe-area-inset-right));background:var(--accent);color:#fff;text-align:center}
#lock .t{font-size:13px;letter-spacing:.12em;opacity:.8}
#lock .ic{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#lock h1{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
#lock .d{font-size:15px;opacity:.85}
#lock form{display:flex;flex-direction:column;gap:10px;width:min(300px,100%);margin-top:18px}
#lock input{font:inherit;font-size:17px;padding:14px 16px;border-radius:12px;border:0;text-align:center;background:rgba(255,255,255,.95);color:#14181F}
#lock button{padding:14px;border-radius:12px;background:#fff;color:var(--accent);font-weight:700;font-size:16px}
#lock .err{min-height:20px;font-size:14px;color:#FFD9C7}

/* ---------- 앱 틀 */
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
.view{padding:calc(env(safe-area-inset-top) + 8px) max(16px,env(safe-area-inset-left)) calc(var(--tabh) + env(safe-area-inset-bottom) + 24px) max(16px,env(safe-area-inset-right))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:12px 2px 14px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
.top .s{font-size:13px;color:var(--muted);font-weight:600}
.dd{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:99px;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.sec{margin-top:22px}
.sec>h2{font-size:13px;font-weight:700;color:var(--muted);margin:0 4px 8px;letter-spacing:.01em}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip small{font-weight:500;opacity:.7;margin-left:4px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pill.tbd{background:transparent;border:1px dashed var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;background:var(--soft);font-size:14px;font-weight:600}
.btn.p{background:var(--accent);color:#fff}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 일정 */
.hero{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--soft)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(8,12,24,.72))}
.hero .tx{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff;display:flex;align-items:flex-end;gap:12px}
.hero .n{font-size:44px;font-weight:800;line-height:.85;letter-spacing:-.04em}
.hero .w{font-size:13px;opacity:.85;font-weight:600}
.hero h2{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .l{font-size:12px;color:var(--muted);font-weight:600}
.mini .v{font-size:15px;font-weight:700;line-height:1.3}
.mini .x{font-size:12px;color:var(--muted)}
.mini.tap{position:relative}
.mini.tap::after{content:"›";position:absolute;right:12px;top:10px;color:var(--muted);font-size:18px}
.packs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.packs span{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--soft);font-weight:600}
.meals{display:grid;grid-template-columns:repeat(3,1fr)}
.meals>div{padding:12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.meals>div+div{border-left:1px solid var(--line)}
.meals .l{font-size:12px;color:var(--muted);font-weight:600}
.meals .v{font-size:14px;font-weight:700;line-height:1.3}
.meals .v.u{color:var(--muted);font-weight:600}
.meals .x{font-size:12px;color:var(--muted);line-height:1.3}
.tl{padding:4px 0}
.tl li{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:11px 14px;position:relative}
.tl li+li{border-top:1px solid var(--line)}
.tl .t{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tl li.mv .t,.tl .tg{color:var(--accent)}
.tl .c{min-width:0}
.tl .c b{font-weight:700;font-size:15px;margin-right:6px}
.tl .tg{font-style:normal;font-size:12px;font-weight:800;margin-right:6px;background:var(--accent-soft);padding:1px 6px;border-radius:6px;position:relative;top:-1px}
.tl .how{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.tl .acts{display:flex;gap:6px}
.tl .go{width:32px;height:32px;border-radius:99px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.tl .go svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wk{padding:10px 8px 8px 0;overflow:hidden}
.wh,.ws{display:grid;grid-template-columns:30px repeat(5,1fr);gap:3px;align-items:end}
.wh{padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.wh button{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.wh b{font-size:15px;font-weight:800}
.wh span{font-size:11px;color:var(--muted);font-weight:600}
.wb{position:relative;display:grid;grid-template-columns:30px repeat(5,1fr);gap:3px;margin-top:4px}
.wt{position:relative}
.wt span{position:absolute;right:4px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-6px)}
.wc{position:relative;min-width:0}
.wc>i{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.we{position:absolute;left:0;right:0;border-radius:6px;background:var(--soft);padding:3px 4px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px;word-break:keep-all}
.we b{font-size:10.5px;font-weight:700;line-height:1.2}
.we span{font-size:9.5px;line-height:1.25;color:var(--muted)}
.we.k1,.we.k3{background:var(--accent-soft)}
.we.k1 b,.we.k3 b,.we.k1 span{color:var(--accent)}
.we.k3 span{color:var(--ink);font-size:10px;line-height:1.55}
.we.k2{background:var(--card);border:1px dashed var(--muted)}
.we.k4{background:transparent;padding:0 4px;justify-content:center}
.we.k4 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.we.k4 b{font-size:9.5px;color:var(--muted)}
.ws{margin-top:6px;padding-top:6px;border-top:1.5px solid var(--ink);font-size:10.5px}
.ws span{font-size:10px;color:var(--muted);text-align:right;padding-right:4px}
.ws b{font-weight:700;text-align:center;line-height:1.2}
.lg{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);margin:10px 4px 0;flex-wrap:wrap}
.lg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lg i.a{background:var(--soft)} .lg i.b{background:var(--accent-soft)} .lg i.c{border:1px dashed var(--muted)}
.ov{padding:6px 0}
.ov h3{display:flex;align-items:baseline;gap:8px;padding:12px 14px 6px;font-size:18px;font-weight:800}
.ov h3 span{font-size:13px;color:var(--muted);font-weight:600}
.ov li{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:7px 14px;font-size:14px}
.ov li .t{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.ov li.k1 b,.ov li.k3 b{color:var(--accent)}
.ov li.k2 b::after{content:"미정";margin-left:6px;font-size:11px;font-weight:700;color:var(--muted);border:1px dashed var(--muted);border-radius:6px;padding:0 5px;vertical-align:1px}
.ov li span{display:block;font-size:12px;color:var(--muted)}
.ov .sl{padding:8px 14px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.ov .sl b{color:var(--ink)}

/* ---------- 지도 */
#v-map{padding:0;position:fixed;inset:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
#map{position:absolute;inset:0;background:var(--soft)}
.mapbar{position:absolute;z-index:500;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);padding:0 12px}
.mapbar .chips .chip{box-shadow:0 2px 8px rgba(15,23,42,.14);border-color:transparent}
.mk{display:flex;align-items:center;gap:4px;cursor:pointer}
.mk i{display:flex;align-items:center;justify-content:center;border-radius:99px;color:#fff;font-style:normal;font-weight:800;font-family:var(--f);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);flex:none}
.mk.food i{background:#23408E;width:28px;height:28px}
.mk.stay i{background:#14181F;width:32px;height:32px}
.mk.sight i{background:#fff;border-color:#23408E;width:28px;height:28px}
.mk.sight i svg.fill{fill:#23408E}
.mk.spot i{background:#6B7280;width:22px;height:22px}
.mk i svg{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mk i svg.fill,.mk i svg .fill{fill:#fff;stroke:none}
.mk.day i{background:#23408E;font-size:13px;width:28px;height:28px}
.mk b{font-size:12px;font-weight:700;color:#14181F;background:rgba(255,255,255,.88);padding:1px 5px;border-radius:6px;white-space:nowrap;font-family:var(--f);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.maplibregl-popup-content{border-radius:14px;padding:12px 14px;font-family:var(--f);font-size:14px;line-height:1.4;color:#14181F}
.maplibregl-popup-close-button{font-size:18px;padding:2px 8px}
.pp b{display:block;font-size:15px;padding-right:14px}
.pp span{display:block;color:#6B7280;font-size:13px;margin-top:2px}
.pp a{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:#23408E;color:#fff!important;font-weight:700;font-size:13px}
#dpanel{position:absolute;z-index:600;left:0;right:0;bottom:0;max-height:44%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(15,23,42,.18);overscroll-behavior:contain}
#dpanel .hd{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line);z-index:1}
#dpanel .hd b{font-size:17px;font-weight:800}
#dpanel .hd span{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}
#dpanel .hd button{font-size:14px;font-weight:700;color:var(--muted);padding:4px 6px}
#dpanel li{display:grid;grid-template-columns:24px 46px 1fr;gap:8px;align-items:start;padding:9px 16px;font-size:14px}
#dpanel li+li{border-top:1px solid var(--line)}
#dpanel li.on{background:var(--accent-soft)}
#dpanel li[data-p]{cursor:pointer}
#dpanel .n{width:22px;height:22px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
#dpanel .n.x{background:transparent}
#dpanel .t{font-weight:700;font-variant-numeric:tabular-nums}
#dpanel li.mv .t,#dpanel .tg{color:var(--accent)}
#dpanel .tg{font-style:normal;font-size:11px;font-weight:800;margin-right:5px;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
#dpanel .c b{font-weight:700;margin-right:5px}
#dpanel .how{display:block;font-size:12px;color:var(--muted)}
@media (min-width:700px){#dpanel{left:auto;top:calc(env(safe-area-inset-top) + 62px);right:12px;bottom:12px;width:360px;max-height:none;border-radius:16px;box-shadow:0 4px 20px rgba(15,23,42,.18)}}
#map .maplibregl-ctrl-top-right{top:calc(env(safe-area-inset-top) + 58px)}
#map .maplibregl-ctrl-group button{width:40px;height:40px}
.locbtn{position:absolute;z-index:500;right:10px;top:calc(env(safe-area-inset-top) + 158px);width:40px;height:40px;border-radius:8px;background:var(--card);box-shadow:0 2px 8px rgba(15,23,42,.2);display:flex;align-items:center;justify-content:center}
.locbtn svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round}

/* ---------- 맛집 · 볼거리 */
.fd{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px}
.fd .ph{position:relative;width:84px;height:84px;display:block}
.fd img{width:84px;height:84px;border-radius:12px;object-fit:cover;display:block;background:var(--soft)}
.fd .ph span{position:absolute;right:4px;bottom:4px;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 6px}
.sph{position:relative;display:block;width:100%}
.sph span{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:3px 8px}
.sph span svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.fd .no{display:inline-flex;width:20px;height:20px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:6px;vertical-align:1px}
.fd h3{font-size:17px;font-weight:800;line-height:1.25}
.fd .sign{font-size:13px;margin-top:2px;color:var(--ink);opacity:.8}
.dish{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:6px}
.dish li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;align-items:flex-start}
.dish li+li{border-top:1px dashed var(--line)}
.dish b{display:block;font-size:14px;font-weight:700}
.dish span{display:block;font-size:12px;color:var(--muted)}
.dish small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.dish em{font-style:normal;font-size:14px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.fd .c{font-size:13px;color:var(--muted);margin-top:2px}
.fd .m{font-size:14px;margin-top:6px;font-weight:600}
.fd dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:13px}
.fd dt{color:var(--muted)}
.fd dd{margin:0}
.fd .btns{grid-column:1 / -1;margin-top:2px}
.list>*+*{margin-top:10px}
.areah{display:flex;align-items:baseline;gap:8px;margin:22px 4px 10px}
.areah b{font-size:18px;font-weight:800}
.areah span{font-size:12px;color:var(--muted)}
.sg img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:var(--r) var(--r) 0 0}
.sg .b{padding:14px 16px 16px}
.sg h3{font-size:18px;font-weight:800}
.sg .e{font-size:12px;color:var(--muted)}
.sg p{margin-top:6px;font-size:14px}
.sg dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0 0;font-size:13px}
.sg dt{color:var(--muted)}
.sg dd{margin:0}

/* ---------- 더보기 */
.rows a,.rows button{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;text-align:left;font-size:16px;font-weight:600}
.rows>*+*{border-top:1px solid var(--line)}
.rows .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
.rows .ic svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rows .s{display:block;font-size:12px;color:var(--muted);font-weight:500}
.rows .ch{margin-left:auto;color:var(--muted);font-size:20px}
.back{display:inline-flex;align-items:center;gap:4px;padding:10px 4px 6px;font-size:15px;font-weight:600;color:var(--accent)}
.subh{font-size:24px;font-weight:800;letter-spacing:-.02em;padding:4px 2px 4px}
.kv{padding:14px 16px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .l{font-size:12px;color:var(--muted);font-weight:600}
.kv .v{font-size:17px;font-weight:800;margin-top:2px}
.kv .x{font-size:13px;color:var(--muted);margin-top:2px}
.stay{padding:16px}
.stay h3{font-size:20px;font-weight:800}
.stay .en{font-size:14px;font-weight:600;margin-top:2px}
.stay .ad{font-size:12px;color:var(--muted);margin-top:4px}
.stay ul{margin-top:10px;display:grid;gap:4px;font-size:14px}
.ck li{display:flex;align-items:flex-start;gap:12px;padding:13px 16px}
.ck li+li{border-top:1px solid var(--line)}
.ck input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;margin:0;display:grid;place-content:center;background:var(--card)}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck li.done .tx{color:var(--muted);text-decoration:line-through}
.ck .tx{font-size:15px;line-height:1.4}
.ck .tx small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
.ck .due{display:inline-block;font-size:12px;font-weight:800;color:var(--accent);margin-right:6px}
.tr{padding:13px 16px}
.tr+.tr{border-top:1px solid var(--line)}
.tr .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tr .h b{font-size:16px;font-weight:800}
.tr .h .tm{font-size:15px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.tr .x{font-size:13px;color:var(--muted);margin-top:3px}
.sv{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 14px}
.sv+.sv{border-top:1px solid var(--line)}
.sv img,.sv .np{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--soft)}
.sv b{font-size:15px;font-weight:700;display:block}
.sv span{font-size:12px;color:var(--muted)}
.sv .p{text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.sv .p span{display:block;font-weight:500}
.show{padding:16px;width:100%;text-align:left}
.show+.show{border-top:1px solid var(--line)}
.show .k{font-size:12px;color:var(--muted);font-weight:600}
.show b{display:block;font-size:19px;font-weight:800;margin-top:2px}
.show .jp{display:block;font-size:14px;margin-top:2px}
.ct{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.ct+.ct{border-top:1px solid var(--line)}
.ct a{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.wx{display:grid;grid-template-columns:repeat(4,1fr)}
.wx div{padding:12px 10px;text-align:center}
.wx .l{font-size:11px;color:var(--muted);font-weight:600}
.wx .v{font-size:18px;font-weight:800}

/* 택시에 보여 주기 (전체 화면) */
#gal{position:fixed;inset:0;z-index:2100;background:#0B0E14;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#gal .gh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
#gal .gh b{font-size:16px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gal .gh button{flex:none;font-size:15px;font-weight:700;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff}
#gal .gs{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#gal .gs::-webkit-scrollbar{display:none}
#gal .gs div{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:8px}
#gal .gs img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#gal .gc{text-align:center;font-size:13px;opacity:.75;padding:10px 0 calc(env(safe-area-inset-bottom) + 14px)}
#big{position:fixed;inset:0;z-index:2000;background:#fff;color:#000;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px)}
#big .say{font-size:20px;font-weight:700}
#big .say span{display:block;font-family:var(--f-jp);font-size:22px;margin-top:4px}
#big .en{font-size:40px;font-weight:900;line-height:1.1;letter-spacing:-.02em}
#big .jp{font-size:26px;line-height:1.35}
#big .ad{font-size:18px;color:#444}
#big button{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;font-size:16px;font-weight:700;padding:10px 14px;border-radius:10px;background:#EEF1F6}
.note{font-size:12px;color:var(--muted);margin:10px 4px 0}
@media (min-width:700px){#v-map:has(#dpanel:not([hidden])) .maplibregl-ctrl-top-right,#v-map:has(#dpanel:not([hidden])) .locbtn{right:384px}}
</style>
</head>
<body>
<div id="lock">
  <img class="ic" src="icon-512.png" alt="">
  <span class="t">홋카이도 가족 여행</span>
  <h1>겨울,<br>삿포로</h1>
  <span class="d">2027. 1. 2 – 1. 6</span>
  <form id="lf" autocomplete="off">
    <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="비밀번호 (숫자)" aria-label="비밀번호" autocomplete="off" enterkeyhint="go">
    <button type="submit">열기</button>
    <span class="err" id="lerr" role="alert"></span>
  </form>
</div>

<div id="app" hidden>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-map" hidden>
    <div id="map"></div>
    <div class="mapbar"><div class="chips" id="mapf"></div></div>
    <aside id="dpanel" hidden></aside>
    <button class="locbtn" id="loc" aria-label="내 위치"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  </section>
  <section class="view" id="v-food" hidden></section>
  <section class="view" id="v-sights" hidden></section>
  <section class="view" id="v-more" hidden></section>
  <nav class="tabs" aria-label="메뉴"><div class="in">
    <button data-tab="plan" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>일정</button>
    <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>지도</button>
    <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M16.5 21V3c-2.5 1.5-3.5 4-3.5 8h3.5"/></svg>맛집</button>
    <button data-tab="sights"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>볼거리</button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>더보기</button>
  </div></nav>
</div>
<div id="big" hidden></div>
<div id="gal" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
'use strict';
const ITER=310000;
const $=(s,r=document)=>r.querySelector(s);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let D=null, buf=null;
const IC={
  cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  map:'<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
  ext:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  tel:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  plane:'<svg viewBox="0 0 24 24"><path d="M10.5 20l2-6 6 2.5 1.5-1.5-6-5 3-6.5-1.5-1-5 5.5-4.5-1.5L4.5 7l4 3-2 4H4l-1 1 3 2 2 3z"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  bus:'<svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="3"/><path d="M5 11h14M8 20.5v-3M16 20.5v-3M8.5 14.5h.01M15.5 14.5h.01"/></svg>',
  bag:'<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  gift:'<svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1.5S10 9 12 9c2 0 6 0 6-1.5S14 5 12 9"/></svg>',
  taxi:'<svg viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM7 19v2M17 19v2M9 6V4h6v2"/></svg>',
  phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>'
};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gm=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q||(p.lat+','+p.lon));
const telh=t=>'tel:'+String(t).replace(/[^\d+]/g,'');

/* ---------------- 잠금 해제 */
async function getBuf(){ if(!buf){ const r=await fetch('data.bin',{cache:'no-cache'}); if(!r.ok) throw new Error('net'); buf=new Uint8Array(await r.arrayBuffer()); } return buf; }
async function decrypt(pw){
  const b=await getBuf(), salt=b.slice(0,16), iv=b.slice(16,28), ct=b.slice(28);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)));
}
async function unlock(pw,silent){
  const btn=$('#lf button'); btn.disabled=true; btn.textContent='여는 중…';
  try{ D=await decrypt(pw); LS.set('sp27.pw',pw); start(); }
  catch(e){ if(!silent) $('#lerr').textContent=(e && e.message==='net')?'불러오지 못했습니다. 인터넷 연결을 확인하세요':'비밀번호가 틀렸습니다'; }
  btn.disabled=false; btn.textContent='열기';
}
$('#lf').addEventListener('submit',e=>{e.preventDefault(); $('#lerr').textContent=''; unlock($('#pw').value.trim());});
const saved=LS.get('sp27.pw'); if(saved) unlock(saved,true);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------------- 탭 */
let cur='plan';
function go(tab,push=true){
  cur=tab;
  document.querySelectorAll('.tabs button').forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  for(const v of ['plan','map','food','sights','more']) $('#v-'+v).hidden=v!==tab;
  if(tab==='map'){ initMap().then(()=>map.resize()); }
  if(tab!=='map') window.scrollTo(0,0);
  if(push) history.pushState({tab},'','#'+tab);
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.tab==='more') renderMore(); go(b.dataset.tab); }));
window.addEventListener('popstate',e=>{
  if(!$('#big').hidden){ $('#big').hidden=true; return; }
  if(!$('#gal').hidden){ $('#gal').hidden=true; return; }
  const s=e.state||{}; if(s.sub) renderSub(s.sub); else if(cur==='more') renderMore();
  go(s.tab||'plan',false);
});

function start(){
  $('#lock').hidden=true; $('#app').hidden=false;
  renderPlan(); renderFood(); renderSights(); renderMore();
  const h=location.hash.slice(1); history.replaceState({tab:'plan'},'','#plan');
  if(['map','food','sights','more'].includes(h)) go(h);
}

/* ---------------- 일정 */
function tripDay(){ const t=new Date(), s=new Date(D.start+'T00:00:00+09:00'), e=new Date(D.end+'T23:59:59+09:00');
  if(t<s){ return {pre:Math.ceil((s-t)/864e5)}; } if(t>e) return {post:true}; return {i:Math.floor((t-s)/864e5)}; }
let dayIdx=0, planMode='ov';
function renderPlan(){
  const td=tripDay(); if(td.i!=null) dayIdx=Math.min(td.i,D.days.length-1);
  const badge=td.pre!=null?`출발까지 ${td.pre}일`:td.i!=null?`여행 ${td.i+1}일째`:'다녀왔어요';
  const v=$('#v-plan');
  v.innerHTML=`<div class="top"><div><span class="s">홋카이도 가족 여행 · 1/2 – 1/6</span><h1>${esc(D.title)}</h1></div><span class="dd">${badge}</span></div>
  <div class="seg" role="group"><button data-m="ov">5일 한눈에</button><button data-m="day">날짜별</button></div>
  <div id="planbody"></div>`;
  v.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{planMode=b.dataset.m; paintPlan();}));
  paintPlan();
}
function paintPlan(){
  $('#v-plan').querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===planMode));
  const pb=$('#planbody');
  if(planMode==='ov'){
    const H0=5,H1=21,PH=46, hrs=[]; for(let h=H0;h<H1;h++) hrs.push(h);
    pb.innerHTML=`<div class="card wk sec"><div class="wh"><span></span>${D.overview.map((o,i)=>`<button data-i="${i}"><b>${o.date}</b><span>${esc(D.days[i].dow[0])}</span></button>`).join('')}</div>
      <div class="wb" style="height:${(H1-H0)*PH}px"><div class="wt">${hrs.map(h=>`<span style="top:${(h-H0)*PH}px">${h}</span>`).join('')}</div>
      ${D.overview.map((o,i)=>`<div class="wc" data-i="${i}">${hrs.map(h=>`<i style="top:${(h-H0)*PH}px"></i>`).join('')}${o.ev.map(e=>{ const top=(e.a-H0)*PH, ht=Math.max((e.b-e.a)*PH-3,16);
        const tt=e.k===1?e.title.split(' · ')[0]:e.title; return `<button class="we k${e.k}" data-i="${i}" style="top:${top+1}px;height:${ht}px"><b>${esc(tt)}</b>${e.k!==3&&e.sub&&ht>30?`<span>${esc(e.sub).replace(/ · 미정$/,'')}</span>`:''}${e.k===3?`<span>${esc(e.sub).split(' · ').join('<br>')}</span>`:''}</button>`; }).join('')}</div>`).join('')}</div>
      <div class="ws"><span>잘 곳</span>${D.overview.map(o=>`<b>${esc(o.sleep.replace('삿포로 ','').replace('료테이 ',''))}</b>`).join('')}</div></div>
      <div class="lg"><span><i class="a"></i>일정</span><span><i class="b"></i>이동</span><span><i class="c"></i>미정</span><span style="margin-left:auto">칸을 누르면 그날 일정</span></div>`;
    pb.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{ dayIdx=+b.dataset.i; planMode='day'; paintPlan(); window.scrollTo(0,0); }));
    return;
  }
  const d=D.days[dayIdx];
  pb.innerHTML=`<div class="chips" style="margin-top:14px">${D.days.map((x,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===dayIdx}">${x.date}<small>${x.dow[0]}</small></button>`).join('')}</div>
  <div class="hero sec" style="margin-top:12px"><img src="${D.photos[d.photo]}" alt=""><div class="tx"><span class="n">${d.date}</span><div><span class="w">${d.dow}</span><h2>${esc(d.title)}</h2></div></div></div>
  <div class="grid2">
    <button class="card mini ${d.sleep.p?'tap':''}" ${d.sleep.p?`data-p="${d.sleep.p}"`:''} style="text-align:left"><span class="l">${esc(d.sleep.l)}</span><span class="v">${esc(d.sleep.name)}</span><span class="x">${esc(d.sleep.sub)}</span></button>
    <div class="card mini"><span class="l">챙길 것</span><div class="packs">${d.pack.map(p=>`<span>${esc(p)}</span>`).join('')}</div></div>
  </div>
  <div class="card meals" style="margin-top:10px">${d.meals.map(m=>`<div><span class="l">${m.l}</span><span class="v ${m.tbd?'u':''}">${esc(m.v)}</span><span class="x">${esc(m.x)}</span></div>`).join('')}</div>
  <div class="sec"><h2>시간표</h2><ol class="card tl">${d.items.map(it=>`<li class="${it.mv?'mv':''}"><span class="t">${esc(it.t)}</span><div class="c">${it.html}</div><span class="acts">${it.ph&&it.ph.length?`<button class="go" data-g="${it.ph.join(',')}" data-t="${esc(it.html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())}" aria-label="사진 보기">${IC.cam}</button>`:''}${it.p?`<button class="go" data-p="${it.p}" aria-label="지도에서 보기">${IC.map}</button>`:''}</span></li>`).join('')}</ol></div>
  <div class="btns"><button class="btn p" id="dmap">${IC.map}이 날 지도 보기</button></div>`;
  pb.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{dayIdx=+b.dataset.i; paintPlan();}));
  pb.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>gallery(b.dataset.g.split(','),b.dataset.t)));
  pb.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>focusPlace(b.dataset.p)));
  $('#dmap').addEventListener('click',()=>{ filt='d'+dayIdx; go('map'); initMap().then(()=>{ map.resize(); setFilter('d'+dayIdx); }); });
}

/* ---------------- 지도 */
let map=null, ready=null, shown=[], filt='all', dayOn=-1, here=null;
const MI={
  food:'<svg viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M16.5 21V3c-2.5 1.5-3.5 4-3.5 8h3.5"/></svg>',
  stay:'<svg viewBox="0 0 24 24"><path d="M3.5 11.5L12 4l8.5 7.5M6 10v10h12V10M10 20v-5h4v5"/></svg>',
  sight:'<svg viewBox="0 0 24 24" class="fill"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  spot:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" class="fill"/></svg>'
};
const FILTERS=[['all','전체'],['food','맛집'],['sight','볼거리'],['stay','숙소']];
const KO=['coalesce',['get','name:ko'],['get','name:en'],['get','name:latin'],''];
function popup(p){ return `<div class="pp"><b>${esc(p.name)}</b><span>${esc(p.sub||'')}</span><a href="${gm(p)}" target="_blank" rel="noopener">구글 지도에서 열기</a></div>`; }
function makeMarker(k,label,cls,showName){
  const p=D.places[k], el=document.createElement('div');
  el.className='mk '+cls; el.innerHTML=`<i>${label}</i>${showName?`<b>${esc(p.name)}</b>`:''}`;
  const m=new maplibregl.Marker({element:el,anchor:'left',offset:[-13,0]}).setLngLat([p.lon,p.lat]).setPopup(new maplibregl.Popup({offset:18,maxWidth:'260px'}).setHTML(popup(p)));
  m._k=k; return m;
}
function initMap(){
  if(map) return ready;
  ready=fetch('https://tiles.openfreemap.org/styles/positron').then(r=>r.json()).then(st=>{
    for(const l of st.layers){
      if(l.layout && l.layout['text-field']) l.layout['text-field']=KO;
      if(/neighbourhood|quarter|suburb|other|hamlet|village|housenumber|shield|poi/.test(l.id)) (l.layout=l.layout||{}).visibility='none';
    }
    map=new maplibregl.Map({container:'map',style:st,center:[141.3515,43.0615],zoom:14.3,attributionControl:{compact:true},dragRotate:false,pitchWithRotate:false,touchPitch:false,maxPitch:0,bearingSnap:180});
    map.touchZoomRotate.disableRotation(); map.keyboard.disableRotation();
    map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
    return new Promise(res=>{
      const done=()=>{ if(!map.getSource('route')){
        map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
        map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#23408E','line-width':3,'line-opacity':.75,'line-dasharray':[2,2]}}); }
        res(); };
      map.once('style.load',done); map.once('load',done);
    });
  });
  $('#mapf').innerHTML=FILTERS.map(f=>`<button class="chip" data-f="${f[0]}">${f[1]}</button>`).join('')+D.days.map((d,i)=>`<button class="chip" data-f="d${i}">${d.date}<small>${d.dow[0]}</small></button>`).join('');
  $('#mapf').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.f)));
  $('#loc').addEventListener('click',()=>{ if(!navigator.geolocation) return; navigator.geolocation.getCurrentPosition(pos=>{ const ll=[pos.coords.longitude,pos.coords.latitude];
    if(!here){ const el=document.createElement('div'); el.style.cssText='width:16px;height:16px;border-radius:99px;background:#1D72F2;border:3px solid #fff;box-shadow:0 0 0 2px rgba(29,114,242,.3)'; here=new maplibregl.Marker({element:el}); }
    here.setLngLat(ll).addTo(map); map.flyTo({center:ll,zoom:15.5}); },()=>{}, {enableHighAccuracy:true,timeout:8000}); });
  ready.then(()=>setFilter(filt,true));
  return ready;
}
function dayStops(i){ const out=[]; D.days[i].items.forEach(it=>{ if(it.p && (!out.length || out[out.length-1]!==it.p)) out.push(it.p); }); return out; }
function clearMarkers(){ shown.forEach(m=>m.remove()); shown=[]; }
function padding(){ const wide=innerWidth>=700, pan=!$('#dpanel').hidden; return {top:70,left:40,right:wide&&pan?390:40,bottom:pan&&!wide?Math.round(innerHeight*.44)+20:40}; }
function fit(pts){ if(!pts.length) return; if(pts.length===1){ map.jumpTo({center:pts[0],zoom:15.5}); return; }
  const b=pts.reduce((bb,p)=>bb.extend(p),new maplibregl.LngLatBounds(pts[0],pts[0])); map.fitBounds(b,{padding:padding(),maxZoom:15.5,duration:0}); }
function setFilter(f,keepView){
  filt=f; if(!map) return;
  $('#mapf').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));
  clearMarkers(); const pts=[];
  if(f[0]==='d'){
    dayOn=+f.slice(1); const stops=dayStops(dayOn);
    stops.forEach((k,i)=>{ const p=D.places[k]; pts.push([p.lon,p.lat]); shown.push(makeMarker(k,i+1,'day',true).addTo(map)); });
    map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:pts}});
    renderPanel(dayOn,stops);
  } else {
    dayOn=-1; $('#dpanel').hidden=true; map.getSource('route').setData({type:'FeatureCollection',features:[]});
    for(const [k,p] of Object.entries(D.places)){
      if(p.kind==='spot') continue;
      if(f==='all'||p.kind===f){ shown.push(makeMarker(k,MI[p.kind],p.kind,p.kind!=='food'||f==='food').addTo(map)); pts.push([p.lon,p.lat]); }
    }
  }
  if(!(keepView && f==='all')) fit(pts);
}
function renderPanel(i,stops){
  const d=D.days[i], pn=$('#dpanel');
  pn.innerHTML=`<div class="hd"><div><b>${d.date}</b><span>${d.dow} · ${esc(d.title)}</span></div><button id="pclose">닫기</button></div><ol>${d.items.map(it=>{ const n=it.p?stops.indexOf(it.p)+1:0;
    return `<li class="${it.mv?'mv':''}" ${it.p?`data-p="${it.p}"`:''}><span class="n ${n?'':'x'}">${n||''}</span><span class="t">${esc(it.t)}</span><div class="c">${it.html}</div></li>`; }).join('')}</ol>`;
  pn.hidden=false; pn.scrollTop=0;
  $('#pclose').addEventListener('click',()=>{ pn.hidden=true; });
  pn.querySelectorAll('li[data-p]').forEach(li=>li.addEventListener('click',()=>{
    pn.querySelectorAll('li').forEach(x=>x.classList.toggle('on',x===li));
    const k=li.dataset.p, p=D.places[k], m=shown.find(x=>x._k===k);
    map.flyTo({center:[p.lon,p.lat],zoom:15.5,padding:padding()}); if(m && !m.getPopup().isOpen()) m.togglePopup();
  }));
}
function focusPlace(k){
  go('map'); const p=D.places[k]; if(!p) return;
  initMap().then(()=>{
    map.resize();
    const inDay=filt[0]==='d' && dayStops(+filt.slice(1)).includes(k);
    if(!inDay){ const f=(filt==='all'||filt===p.kind)&&p.kind!=='spot'?filt:'all'; setFilter(f,true);
      if(!shown.find(x=>x._k===k)){ shown.push(makeMarker(k,MI[p.kind],p.kind,true).addTo(map)); } }
    const m=shown.find(x=>x._k===k);
    map.jumpTo({center:[p.lon,p.lat],zoom:15.5}); if(m && !m.getPopup().isOpen()) m.togglePopup();
  });
}

/* ---------------- 맛집 */
let area=-1;
function renderFood(){
  const v=$('#v-food');
  v.innerHTML=`<div class="top"><div><span class="s">호텔에서 걸어서 · 가격은 2026년 11월 조사 · 정월 영업은 12월에 다시 확인</span><h1>맛집</h1></div></div>
  <div class="seg" id="aseg"><button data-a="-1">전체</button>${D.food.map((a,i)=>`<button data-a="${i}">${esc(a.name.replace(' 주변',''))}</button>`).join('')}</div>
  <div id="fbody"></div>
  <div class="btns" style="margin-top:18px"><button class="btn p" id="fmap">${IC.map}맛집 전부 지도에서 보기</button></div>`;
  v.querySelectorAll('#aseg button').forEach(b=>b.addEventListener('click',()=>{area=+b.dataset.a; paintFood();}));
  $('#fmap').addEventListener('click',()=>{ filt='food'; go('map'); initMap().then(()=>{ map.resize(); setFilter('food'); }); });
  paintFood();
}
function paintFood(){
  $('#aseg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.a===area));
  const areas=area<0?D.food:[D.food[area]];
  $('#fbody').innerHTML=areas.map(a=>`<div class="areah"><b>${esc(a.name)}</b><span>${esc(a.sub)}</span></div><div class="list">${a.items.map(f=>`
    <article class="card fd"><button class="ph" data-g="${f.g.join(',')}" data-t="${esc(f.name)}"><img src="${f.img}" alt="" loading="lazy">${gcount(f.g)?`<span>${gcount(f.g)}</span>`:''}</button><div>
      <h3>${esc(f.name)}</h3><div class="sign jp">${esc(f.jp)}</div><div class="c">${esc(f.cat)}</div>
      <dl><dt>위치</dt><dd>${esc(f.where)}</dd><dt>시간</dt><dd>${esc(f.hours)}</dd><dt>1/3~6</dt><dd><span class="pill ${f.st.k}">${esc(f.st.t)}</span></dd><dt>예약</dt><dd>${esc(f.rsv)}</dd></dl></div>
      <ul class="dish">${f.dishes.map(x=>`<li><div><b>${esc(x.ko)}</b><span class="jp">${esc(x.jp)}</span>${x.x?`<small>${esc(x.x)}</small>`:''}</div><em>${esc(x.p)}</em></li>`).join('')}</ul>
      <div class="btns">${gcount(f.g)?`<button class="btn" data-g="${f.g.join(',')}" data-t="${esc(f.name)}">${IC.cam}사진 ${gcount(f.g)}장</button>`:''}<button class="btn p" data-p="${f.k}">${IC.map}지도</button><a class="btn" href="${gm(D.places[f.k])}" target="_blank" rel="noopener">${IC.ext}구글 지도</a>${f.tel.map(t=>`<a class="btn" href="${telh(t)}">${IC.tel}전화</a>`).join('')}</div>
    </article>`).join('')}</div>`).join('');
  $('#fbody').querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>focusPlace(b.dataset.p)));
  $('#fbody').querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>gallery(b.dataset.g.split(','),b.dataset.t)));
}

  <div class="list">${D.sights.map(s=>`<article class="card sg"><button class="sph" data-g="${s.g.join(',')}" data-t="${esc(s.name)}"><img src="${s.img}" alt="" loading="lazy">${gcount(s.g)?`<span>${IC.cam}${gcount(s.g)}</span>`:''}</button><div class="b">
    <h3>${esc(s.name)}</h3><div class="e">${esc(s.en)}</div><p>${esc(s.desc)}</p>
    <dl><dt>시간</dt><dd>${esc(s.time)}</dd><dt>1/3~6</dt><dd><span class="pill ${s.st.k}">${esc(s.st.t)}</span></dd><dt>가는 법</dt><dd>${esc(s.go)}</dd></dl>
    <div class="btns">${gcount(s.g)?`<button class="btn" data-g="${s.g.join(',')}" data-t="${esc(s.name)}">${IC.cam}사진 ${gcount(s.g)}장</button>`:''}<button class="btn p" data-p="${s.k}">${IC.map}지도</button><a class="btn" href="${gm(D.places[s.k])}" target="_blank" rel="noopener">${IC.ext}구글 지도</a></div></div></article>`).join('')}</div>`;

}

/* ---------------- 더보기 */
const SUBS=[['trip','비행기 · 숙소','시간, 주소, 전화','plane'],['show','택시에 보여 주기','영어 · 일본어 주소 크게','taxi'],['move','이동 · 교통','타는 곳, 출발 → 도착','bus'],
  ['book','예약 현황','예약 번호','ok'],['todo','할 일','출발 전에 할 것','list'],['pack','챙길 것','체크해 두기','bag'],['gift','기념품','가격 · 파는 곳','gift'],['call','연락처','숙소 · 영사콜센터 · 긴급','phone']];
function renderMore(){
  $('#v-more').innerHTML=`<div class="top"><div><span class="s">여행 정보</span><h1>더보기</h1></div></div>
  <div class="card rows">${SUBS.map(s=>`<button data-s="${s[0]}"><span class="ic">${IC[s[3]]}</span><span>${s[1]}<span class="s">${s[2]}</span></span><span class="ch">›</span></button>`).join('')}</div>
  <p class="note">체크 표시는 이 휴대폰에만 저장됩니다.</p>`;
  $('#v-more').querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{ renderSub(b.dataset.s); history.pushState({tab:'more',sub:b.dataset.s},'','#more'); window.scrollTo(0,0); }));
}
function ckList(items){ return `<ul class="card ck">${items.map(it=>{ const on=LS.get('sp27.ck.'+it.id)==='1'; return `<li class="${on?'done':''}"><input type="checkbox" id="${it.id}" ${on?'checked':''}><label class="tx" for="${it.id}">${it.html}</label></li>`; }).join('')}</ul>`; }
function bindCk(root){ root.querySelectorAll('.ck input').forEach(c=>c.addEventListener('change',()=>{ LS.set('sp27.ck.'+c.id,c.checked?'1':'0'); c.closest('li').classList.toggle('done',c.checked); })); }
function renderSub(s){
  const sub=SUBS.find(x=>x[0]===s); let h='';
  if(s==='trip') h=`<div class="sec"><h2>비행기</h2><div class="card">${D.flights.map(f=>`<div class="kv"><div class="l">${esc(f.d)}</div><div class="v">${esc(f.r)}</div><div class="x">${esc(f.c)} · ${esc(f.note)}</div></div>`).join('')}</div></div>
    <div class="sec"><h2>숙소</h2><div class="list">${D.stays.map(t=>`<div class="card stay"><div class="l" style="font-size:12px;color:var(--muted);font-weight:600">${esc(t.d)}</div><h3>${esc(t.name)}</h3><div class="en">${esc(t.en)}</div><div class="ad">${esc(t.ad)}<br><span class="jp">${esc(t.jp)}</span></div>
      <ul><li>${esc(t.room)} · ${esc(t.meal)}</li><li>${esc(t.io)}</li></ul>
      <div class="btns">${gcount(t.g)?`<button class="btn" data-g="${t.g.join(',')}" data-t="${esc(t.name)}">${IC.cam}사진 ${gcount(t.g)}장</button>`:''}<button class="btn p" data-p="${t.p}">${IC.map}지도</button><a class="btn" href="${telh(t.tel)}">${IC.tel}${esc(t.tel)}</a></div></div>`).join('')}</div></div>`;
  if(s==='show') h=`<p class="note" style="margin-top:4px">누르면 화면 가득 크게 나옵니다. 택시 기사에게 그대로 보여 주세요.</p><div class="card sec" style="margin-top:10px">${D.shows.map((x,i)=>`<button class="show" data-i="${i}"><span class="k">${esc(x.k)} · ${esc(x.d)}</span><b>${esc(x.en)}</b><span class="jp">${esc(x.jp)}</span></button>`).join('')}</div>`;
  if(s==='move') h=`<div class="card sec">${D.transport.map(t=>`<div class="tr"><div class="h"><b>${esc(t.date)} ${esc(t.kind)} · ${esc(t.route)}</b><span class="tm">${esc(t.time)}</span></div><div class="x">${esc(t.where)} · ${esc(t.rsv)}</div></div>`).join('')}</div>
    <p class="note">기차표는 타기 전에 역 발매기에서 사면 됩니다. 시각은 11/14 조회 기준이고, 정월 운행 공지는 아직 나오지 않았습니다.</p>`;
  if(s==='book') h=`<div class="card sec">${D.bookings.map(b=>`<div class="kv"><div class="l">${esc(b.cat)} · ${esc(b.when)}</div><div class="v" style="font-size:15px">${esc(b.what)}</div><div class="x">${esc(b.no)}</div></div>`).join('')}</div>`;
  if(s==='todo') h=`<div class="sec">${ckList(D.todos.map(t=>({id:t.id,html:`<span class="due">${esc(t.due)}</span>${esc(t.what)}<small>${esc(t.cat)}${t.where?' · '+esc(t.where):''}</small>`})))}</div>`;
  if(s==='pack') h=`<div class="card wx sec">${D.weather.map(w=>`<div><div class="l">${w[0]}</div><div class="v">${w[1]}</div></div>`).join('')}</div>`+D.pack.map((g,gi)=>`<div class="sec"><h2>${esc(g.t)}</h2>${ckList(g.items.map((it,ii)=>({id:`p${gi}_${ii}`,html:esc(it)})))}</div>`).join('');
  if(s==='gift') h=`<p class="note" style="margin-top:4px">삿포로 · 오타루 · 노보리베츠에서 사는 것. 세금 포함 가격.</p><div class="card sec" style="margin-top:10px">${D.souvenirs.map(g=>`<div class="sv">${g.img?`<img src="${g.img}" alt="" loading="lazy">`:'<div class="np"></div>'}<div><b>${esc(g.name)}</b><span>${esc(g.where)}${g.memo?' · '+esc(g.memo):''}</span></div><div class="p">${esc(g.price)}<span>${esc(g.size)}</span></div></div>`).join('')}</div>
    <div class="card sec">${[['한국에 못 들고 오는 것','햄 · 소시지 · 베이컨 · 육포 · 생과일. 치즈와 버터는 세관 신고'],['비행기 탈 때','젤리와 푸딩은 액체 취급. 부치는 짐에'],['면세','한 가게에서 하루 ¥5,000(세금 제외) 이상. 출국 때 짐 부치기 전에 물건 보여 주기']].map(x=>`<div class="kv"><div class="l">${x[0]}</div><div class="x" style="color:var(--ink);font-size:14px">${x[1]}</div></div>`).join('')}</div>`;
  if(s==='call') h=`<div class="card sec">${D.contacts.map(c=>`<div class="ct"><span>${esc(c.n)}</span><a href="${telh(c.t)}">${esc(c.t)}</a></div>`).join('')}</div>`;
  const v=$('#v-more');
  v.innerHTML=`<button class="back" id="bk">‹ 더보기</button><h1 class="subh">${sub[1]}</h1>${h}`;
  $('#bk').addEventListener('click',()=>history.back());
  v.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>focusPlace(b.dataset.p)));
  v.querySelectorAll('.show').forEach(b=>b.addEventListener('click',()=>bigShow(D.shows[+b.dataset.i])));
  v.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>gallery(b.dataset.g.split(','),b.dataset.t)));
  bindCk(v);
}
function gcount(keys){ return (keys||[]).reduce((n,k)=>n+((D.gal[k]||[]).length),0); }
function gallery(keys,title){
  const imgs=keys.flatMap(k=>D.gal[k]||[]); if(!imgs.length) return;
  const g=$('#gal');
  g.innerHTML=`<div class="gh"><b>${esc(title)}</b><button id="gx">닫기</button></div><div class="gs">${imgs.map(s=>`<div><img src="${s}" alt=""></div>`).join('')}</div><div class="gc"><span id="gn">1</span> / ${imgs.length} · 옆으로 넘기기</div>`;
  g.hidden=false; history.pushState({tab:cur,gal:1},'','#'+cur);
  const gs=g.querySelector('.gs'); gs.addEventListener('scroll',()=>{ $('#gn').textContent=Math.round(gs.scrollLeft/gs.clientWidth)+1; });
  $('#gx').addEventListener('click',()=>history.back());
}
function bigShow(x){
  const b=$('#big');
  b.innerHTML=`<button id="bx">닫기</button><div class="say">Please take us to this place.<span>ここへ行きたいです。お願いします。</span></div><div class="en">${esc(x.en)}</div><div class="jp">${esc(x.jp.replace(' · ','\n')).replace('\n','<br>')}</div><div class="ad">${esc(x.ad)}</div>`;
  b.hidden=false; history.pushState({tab:'more',sub:'show',big:1},'','#more');
  $('#bx').addEventListener('click',()=>history.back());
}
})();
</script>
